stages:
  - pre-check
  - build
  - test
  - deploy

variables:
  RUN_WINDOWS: true

include:
  - component: "gitlab.com/sequoia-pgp/common-ci/sequoia-pipeline@main"

pages:
  stage: build
  image: registry.sequoia-pgp.org/sequoia-pgp/build-docker-image/trixie-pandoc:latest
  script:
    - ASSET_OUT_DIR=/tmp/assets cargo doc --no-deps
    - mkdir public
    - mv -v target/doc public/impl

    # Man pages.
    - /tmp/assets/man-pages/man2html.sh --generate
    - mkdir public/man
    - mv -v $(for f in $(/tmp/assets/man-pages/man2html.sh --html-files); do echo /tmp/assets/man-pages/$f; done) public/man
    - echo "/sequoia-sqv/man /sequoia-sqv/man/$(/tmp/assets/man-pages/man2html.sh --html-root) 302" >> public/_redirects
  artifacts:
    paths:
      - public
  pages: false

pages-deploy:
  stage: deploy
  image: registry.sequoia-pgp.org/sequoia-pgp/build-docker-image/trixie-pandoc:latest
  script: echo "publishing"
  artifacts:
    paths:
      - public
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
