[package]
name = "sequoia-sqv"
description = "A simple OpenPGP signature verification program"
version = "1.3.0"
authors = [
    "Justus Winter <justus@sequoia-pgp.org>",
    "Kai Michaelis <kai@sequoia-pgp.org>",
    "Neal H. Walfield <neal@sequoia-pgp.org>",
]
documentation = "https://gitlab.com/sequoia-pgp/sequoia-sqv"
homepage = "https://sequoia-pgp.org/"
repository = "https://gitlab.com/sequoia-pgp/sequoia-sqv"
readme = "README.md"
keywords = ["cryptography", "openpgp", "pgp", "signature", "verification"]
categories = ["cryptography", "command-line-utilities"]
license = "LGPL-2.0-or-later"
edition = "2021"
rust-version = "1.85"
resolver = "3"
exclude = [".ci", ".gitlab-ci.yml"]

[badges]
gitlab = { repository = "sequoia-pgp/sequoia" }
maintenance = { status = "actively-developed" }

[dependencies]
anyhow = "1.0.18"
chrono = "0.4.10"
clap = { version = "4", features = ["derive", "string", "wrap_help"] }
sequoia-openpgp = { version = "2", default-features = false }
sequoia-policy-config = "0.8"

[build-dependencies]
anyhow = "1.0.18"
chrono = "0.4.10"
clap = { version = "4", features = ["derive", "string", "wrap_help"] }
clap_complete = { version = "4"}
sequoia-man = "0.3"
sequoia-openpgp = { version = "2", default-features = false }
sequoia-policy-config = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[[bin]]
name = "sqv"
path = "src/sqv.rs"
bench = false

[features]
default = ["crypto-nettle"]
crypto-nettle = ["sequoia-openpgp/crypto-nettle"]
crypto-openssl = ["sequoia-openpgp/crypto-openssl"]
crypto-botan = ["sequoia-openpgp/crypto-botan"]
crypto-botan2 = ["sequoia-openpgp/crypto-botan2"]
crypto-cng = ["sequoia-openpgp/crypto-cng"]
crypto-rust = ["sequoia-openpgp/crypto-rust"]

[lints.clippy]
# default clippy lint levels matching the common-ci environment:
# https://gitlab.com/sequoia-pgp/common-ci/-/blob/main/templates/precheck.yml
suspicious = { level = "deny", priority = -1 }
style = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }
